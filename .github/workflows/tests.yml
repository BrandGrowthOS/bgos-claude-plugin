name: plugin-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --test "test/**/*.test.ts"

      - name: Type check
        run: bun run build
