name: plugin-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The startup gate tests run the real lib/gate-block.tcl under a real expect and assert the exact
      # bytes it sends. Where expect is missing they return early, which reports PASS. So install it,
      # and make its absence a failure rather than a green run that proved nothing.
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Run tests
        run: npm test
        env:
          HOAI_REQUIRE_EXPECT: '1'

      - name: Type check
        run: bun run build
