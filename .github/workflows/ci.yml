name: CI

# Type-check the MCP server and run the message-text eval suite on every push
# and pull request. The plugin is a single TypeScript file (server.ts) plus the
# pure helpers in lib/, exercised by node --test in test/. Daemons install the
# published plugin at @latest, so a green CI here is the gate that protects the
# live agent channel (reply / peer / inbound / set_status / events).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # No lockfile-pinned npm deps are required to build/test (the suite is
        # dependency-free node --test), but install dev deps for tsc + types.
        run: npm install --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npm run build

      - name: Eval suite (node --test)
        run: npm test
